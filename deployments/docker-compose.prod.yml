version: '3.8'

services:
  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - dashboard

  api:
    restart: always
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO

  dashboard:
    restart: always
    environment:
      - NODE_ENV=production
