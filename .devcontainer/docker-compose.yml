version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: graphoath-postgres
    environment:
      POSTGRES_USER: graphoath
      POSTGRES_PASSWORD: graphoath_secret_pass
      POSTGRES_DB: graphoath_ledger
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../migrations/0001_initial.sql:/docker-entrypoint-initdb.d/0001_initial.sql

  minio:
    image: minio/minio:latest
    container_name: graphoath-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: graphoath-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"

  prometheus:
    image: prom/prometheus:latest
    container_name: graphoath-prometheus
    ports:
      - "9090:9090"

  graphoath-backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: graphoath-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://graphoath:graphoath_secret_pass@postgres:5432/graphoath_ledger
      DATAHUB_GMS_URL: http://datahub-gms:8080
      MINIO_ENDPOINT: http://minio:9000
    depends_on:
      - postgres
      - minio

  graphoath-dashboard:
    build:
      context: ../src/dashboard
      dockerfile: Dockerfile
    container_name: graphoath-dashboard
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://graphoath-backend:8000
    depends_on:
      - graphoath-backend

volumes:
  postgres_data:
  minio_data:
