name: Deploy Staging

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build & Test Artifacts
        run: |
          pip install -r requirements.txt
          pytest tests/unit

      - name: Deploy to Staging Environment
        run: |
          echo "Deploying GraphOath staging container bundle..."
